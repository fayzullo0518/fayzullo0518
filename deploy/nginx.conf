# ===========================================================
#  Gold Med Nova — nginx (uzcloud.uz yoki boshqa VPS uchun)
#
#  /etc/nginx/sites-available/goldmednova ga qo‘ying,
#  keyin:
#     sudo ln -s /etc/nginx/sites-available/goldmednova \
#                /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
#  SSL sertifikat:
#     sudo certbot --nginx -d goldmednova.uz -d www.goldmednova.uz
# ===========================================================

# yuklash oynasiga qarshi oddiy himoya: bir IP dan soniyasiga 20 so‘rov
limit_req_zone $binary_remote_addr zone=gmn_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=gmn_conn:10m;

upstream goldmednova {
    server 127.0.0.1:5175;
    keepalive 32;
}

# --- HTTP -> HTTPS -----------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name goldmednova.uz www.goldmednova.uz;

    # certbot shu yo‘lni ochiq qoldirishni talab qiladi
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# --- HTTPS --------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name goldmednova.uz www.goldmednova.uz;

    ssl_certificate     /etc/letsencrypt/live/goldmednova.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goldmednova.uz/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # --- xavfsizlik sarlavhalari -----------------------------
    # CSP, X-Frame-Options va boshqalarni ilovaning o‘zi (helmet)
    # qo‘yadi — bu yerda faqat HSTS va server nomini yashirish.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # --- hajm chegaralari ------------------------------------
    # 50 MB rasm + zaxira
    client_max_body_size 60m;
    client_body_timeout 120s;
    client_header_timeout 20s;
    send_timeout 120s;
    large_client_header_buffers 4 16k;

    # --- gzip ------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    limit_conn gmn_conn 40;

    # --- API -------------------------------------------------
    location /api/ {
        limit_req zone=gmn_api burst=40 nodelay;

        proxy_pass         http://goldmednova;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- yuklangan fayllar -----------------------------------
    # Hech qachon bajarilmasin: faqat yuklab olinadi/ko‘rsatiladi.
    location /uploads/ {
        proxy_pass         http://goldmednova;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;

        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'" always;
        expires 7d;
    }

    # --- sayt ------------------------------------------------
    location / {
        proxy_pass         http://goldmednova;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # yashirin fayllarga murojaatni butunlay yopish
    location ~ /\.(?!well-known) {
        deny all;
    }
}
