# Fly.io — `fly launch --no-deploy` keyin `fly deploy`.
#
# Bu yerda haqiqiy disk bor, shuning uchun baza ham, 50 MB gacha rasm va
# shartnomalar ham to'g'ridan-to'g'ri diskda yotadi — tashqi baza kerak emas.
app = "goldmednova"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "5175"
  FORCE_HTTPS = "false"   # Fly proksisi HTTPS'ni o'zi majburlaydi
  TRUST_PROXY = "1"
  TOKEN_TTL = "12h"
  DATA_DIR = "/data"
  MAX_UPLOAD_MB = "50"

# fly volumes create goldmednova_data --size 1 --region fra
[[mounts]]
  source = "goldmednova_data"
  destination = "/data"

[http_service]
  internal_port = 5175
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response.headers]
    Server = ""

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
